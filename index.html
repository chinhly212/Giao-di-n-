<div id="toast" class="hidden fixed top-14 left-1/2 -translate-x-1/2 glass-panel border border-red-500/40 text-white text-[11px] px-4 py-2 rounded-xl shadow-2xl z-50 flex items-center gap-2 whitespace-nowrap">

                    <script>
'use strict';

// =========================================================================
// ⚠️ CẤU HÌNH MÁY CHỦ JSONBIN: BẠN HÃY ĐIỀN LINK VÀ KEY CỦA BẠN VÀO ĐÂY ⚠️
// =========================================================================
const JSONBIN_ID = "6aeec6a0ac6210605a7487dc"; 
const JSONBIN_KEY = "$2a$10$hI7P43ZHI26VHT8wDR7y9.kPyyJV.YeC.w/LViVyGm1eUZuzaQlXC";
const JSONBIN_URL = "https://jsonbin.io/app/bins" + JSONBIN_ID;
// =========================================================================

const STORAGE_KEY = 'vibnest_channels_v2';
const ADMIN_HASHES = [
    '8d969eef6ecad3c29a3a629280e686cf0c3f5d5a86aff3ca12020c923adc6c92',
    'f2eb9f9c8d1c3c8f9e5f3b1c5c0a8e2b8c1f1d3a5c7e9f2b4d6a8c0e1f3a5b7c' 
];

const defaultChannels = [
    { id: '1', platform: 'tiktok',   name: 'VibNest Official TikTok',    followers: '250.5K Follower',      desc: 'Chia sẻ các mẹo AI.', url: 'https://tiktok.com' },
    { id: '2', platform: 'tiktok',   name: 'VibNest Shorts & Reels',     followers: '120.0K Follower',      desc: 'Video ngắn xu hướng.', url: 'https://tiktok.com' },
    { id: '3', platform: 'youtube',  name: 'VibNest Media Network',      followers: '85.4K Subscriber',     desc: 'Đánh giá AI.', url: 'https://youtube.com' },
    { id: '4', platform: 'facebook', name: 'VibNest Fanpage Chính Thức', followers: '310.2K Người theo dõi', desc: 'Hỗ trợ cộng đồng.', url: 'https://facebook.com' }
];

// STATE
let channels = [];
let currentTab = 'tiktok';
let isAdmin = false;
let logoClickCount = 0;
let logoClickTimer = null;
const CLICK_WINDOW_MS = 3000;

// UTILS
function escapeHtml(str) {
    return str ? String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;") : '';
}
function safeId(id) { return /^[A-Za-z0-9_-]{1,40}$/.test(String(id)) ? String(id) : null; }
function isValidUrl(url) {
    try { const u = new URL(url); return ['http:', 'https:'].includes(u.protocol); } catch { return false; }
}
async function sha256(text) {
    if (!window.crypto?.subtle) return null;
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}

// LOAD & SAVE DATA (KẾT NỐI MÁY CHỦ)
async function loadChannels() {
    // Nếu chưa điền API, dùng dữ liệu máy (offline)
    if (JSONBIN_ID.includes("ĐIỀN_BIN") || JSONBIN_KEY.includes("ĐIỀN_MASTER")) {
        console.warn("Chưa cấu hình JSONBin, dùng dữ liệu Local.");
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [...defaultChannels];
    }

    try {
        showToast('⏳ Đang tải dữ liệu từ máy chủ...');
        const response = await fetch(JSONBIN_URL + '/latest', {
            method: 'GET',
            headers: { 'X-Master-Key': JSONBIN_KEY, 'X-Bin-Meta': 'false' }
        });
        if (!response.ok) throw new Error('Lỗi mạng');
        const data = await response.json();
        showToast('✅ Đã tải dữ liệu');
        return Array.isArray(data) ? data : [...defaultChannels];
    } catch (error) {
        console.error("Lỗi:", error);
        showToast('⚠️ Lỗi máy chủ, dùng dữ liệu tạm');
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [...defaultChannels];
    }
}

async function saveToLocalStorage() {
    // 1. Luôn lưu tạm vào máy
    localStorage.setItem(STORAGE_KEY, JSON.stringify(channels));
    
    // 2. Nếu chưa cấu hình API thì dừng
    if (JSONBIN_ID.includes("6aeec6a0ac6210605a7487dc") || JSONBIN_KEY.includes("$2a$10$hI7P43ZHI26VHT8wDR7y9.kPyyJV.YeC.w/LViVyGm1eUZuzaQlXC")) return;

    // 3. Đẩy lên máy chủ
    try {
        const response = await fetch(JSONBIN_URL, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_KEY },
            body: JSON.stringify(channels)
        });
        if (!response.ok) throw new Error('Lỗi mạng');
        console.log("Đã đồng bộ máy chủ");
    } catch (error) {
        console.error("Lỗi lưu:", error);
        showToast('⚠️ Không thể đồng bộ lên máy chủ. Đã lưu tạm.');
    }
}

// TOAST
let toastTimer = null;
function showToast(msg) {
    const toast = document.getElementById('toast');
    document.getElementById('toastMsg').innerText = msg;
    toast.classList.remove('hidden');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.add('hidden'), 2500);
}

// TAB SWITCHING
function switchTab(tab) {
    if (!['tiktok', 'youtube', 'facebook', 'wechat', 'contact'].includes(tab)) return;
    currentTab = tab;

    document.querySelectorAll('.nav-tab-btn').forEach(btn => {
        btn.className = 'nav-tab-btn flex-1 py-1.5 rounded-xl flex flex-col items-center gap-0.5 text-gray-400 transition';
    });
    document.getElementById(`tabBtn-${tab}`).className = 'nav-tab-btn flex-1 py-1.5 rounded-xl flex flex-col items-center gap-0.5 text-red-500 transition font-bold';

    document.getElementById('channelTabContent').classList.add('hidden');
    document.getElementById('wechatTabContent').classList.add('hidden');
    document.getElementById('contactTabContent').classList.add('hidden');

    if (tab === 'wechat') document.getElementById('wechatTabContent').classList.remove('hidden');
    else if (tab === 'contact') document.getElementById('contactTabContent').classList.remove('hidden');
    else {
        document.getElementById('channelTabContent').classList.remove('hidden');
        renderCurrentTab();
    }
}

// RENDER CARDS
function renderCurrentTab() {
    const container = document.getElementById('channelsListContainer');
    const titleEl = document.getElementById('currentTabTitle');
    const countEl = document.getElementById('channelCountBadge');
    const filtered = channels.filter(c => c.platform === currentTab);

    const titles = {
        tiktok: `<i class="fa-brands fa-tiktok text-red-500 text-sm"></i> <span>Kênh TikTok</span>`,
        youtube: `<i class="fa-brands fa-youtube text-red-500 text-sm"></i> <span>Kênh YouTube</span>`,
        facebook: `<i class="fa-brands fa-facebook text-blue-500 text-sm"></i> <span>Facebook</span>`
    };
    titleEl.innerHTML = titles[currentTab] || '';
    countEl.innerText = `${filtered.length} Kênh`;
    container.innerHTML = '';

    if (filtered.length === 0) {
        container.innerHTML = `<div class="glass-card rounded-2xl p-8 text-center text-gray-500 text-xs">Chưa có kênh nào.</div>`;
        return;
    }

    filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'glass-card rounded-2xl p-4 flex flex-col justify-between gap-3 relative cursor-pointer';
        
        const iconMap = { tiktok: 'fa-tiktok text-red-400', youtube: 'fa-youtube text-red-500', facebook: 'fa-facebook text-blue-500' };

        card.innerHTML = `
            <div class="flex items-start justify-between gap-2">
                <div class="flex items-center gap-3 min-w-0">
                    <div class="w-10 h-10 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-lg shrink-0">
                        <i class="fa-brands ${iconMap[item.platform]}"></i>
                    </div>
                    <div class="min-w-0">
                        <h3 class="font-bold text-sm text-white leading-snug truncate">${escapeHtml(item.name)}</h3>
                        <span class="text-[11px] font-semibold text-amber-400">${escapeHtml(item.followers)}</span>
                    </div>
                </div>
                ${isAdmin ? `
                    <div class="flex items-center gap-1 shrink-0">
                        <button class="admin-btn edit-btn w-7 h-7 bg-white/10 text-gray-300 rounded-lg flex items-center justify-center text-xs"><i class="fa-solid fa-pen"></i></button>
                        <button class="admin-btn del-btn w-7 h-7 bg-red-500/20 text-red-400 rounded-lg flex items-center justify-center text-xs"><i class="fa-solid fa-trash"></i></button>
                    </div>
                ` : ''}
            </div>
            ${item.desc ? `<p class="text-xs text-gray-400 line-clamp-2">${escapeHtml(item.desc)}</p>` : ''}
            <div class="flex items-center justify-between pt-1 border-t border-white/5 text-[11px]">
                <span class="text-gray-500">Bấm để mở</span>
                <span class="text-red-400 font-semibold flex items-center gap-1">Truy cập <i class="fa-solid fa-arrow-up-right-from-square text-[9px]"></i></span>
            </div>
        `;

        card.addEventListener('click', (e) => {
            if (e.target.closest('.admin-btn')) return;
            if (isValidUrl(item.url)) window.open(item.url, '_blank', 'noopener,noreferrer');
            else showToast('⚠️ Đường dẫn không hợp lệ');
        });

        if (isAdmin) {
            card.querySelector('.edit-btn').addEventListener('click', (e) => { e.stopPropagation(); editChannel(item.id); });
            card.querySelector('.del-btn').addEventListener('click', (e) => { e.stopPropagation(); deleteChannel(item.id); });
        }
        container.appendChild(card);
    });
}
                            // ADMIN AUTH (Bí mật nhấn 5 lần)
    function setupSecretTrigger() {
        const logo = document.getElementById('secretLogoTrigger');
        
        function resetCounter() { logoClickCount = 0; clearTimeout(logoClickTimer); }

        function handleClick(e) {
            if (e) e.preventDefault();
            logoClickCount++;

            if (logoClickCount >= 5) {
                resetCounter();
                if (!isAdmin) document.getElementById('adminAuthModal').classList.remove('hidden');
                else showToast('🔑 Bạn đang ở chế độ Admin');
                return;
            }
            clearTimeout(logoClickTimer);
            logoClickTimer = setTimeout(resetCounter, CLICK_WINDOW_MS);
        }

        logo.addEventListener('pointerdown', handleClick);
        logo.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); handleClick(e); }
        });
    }

    function closeAdminAuthModal() {
        document.getElementById('adminAuthModal').classList.add('hidden');
        document.getElementById('adminPinInput').value = '';
        document.getElementById('pinError').classList.add('hidden');
    }

    async function verifyAdminPin() {
        const input = document.getElementById('adminPinInput');
        const errEl = document.getElementById('pinError');
        const pin = input.value.trim();
        if (!pin) return;

        const hash = await sha256(pin);
        const valid = hash ? ADMIN_HASHES.includes(hash) : (pin === '123456' || pin === '151121');

        if (valid) {
            isAdmin = true;
            closeAdminAuthModal();
            document.getElementById('adminToolbar').classList.remove('hidden');
            showToast('🔑 Đã mở khóa Admin!');
            renderCurrentTab();
        } else {
            errEl.classList.remove('hidden');
            input.value = ''; input.focus();
        }
    }

    function lockAdmin() {
        isAdmin = false;
        document.getElementById('adminToolbar').classList.add('hidden');
        showToast('🔒 Đã khóa Admin');
        renderCurrentTab();
    }

    // CRUD KÊNH
    function openAddModal() {
        if (!isAdmin) return;
        document.getElementById('editChannelId').value = '';
        document.getElementById('formPlatform').value = currentTab;
        document.getElementById('formName').value = '';
        document.getElementById('formFollowers').value = '';
        document.getElementById('formDesc').value = '';
        document.getElementById('formUrl').value = '';
        document.getElementById('modalFormTitle').innerHTML = '<i class="fa-solid fa-plus text-red-500"></i><span>Thêm kênh mới</span>';
        document.getElementById('channelFormModal').classList.remove('hidden');
    }

    function editChannel(id) {
        if (!isAdmin) return;
        const item = channels.find(c => c.id === id);
        if (!item) return;
        document.getElementById('editChannelId').value = item.id;
        document.getElementById('formPlatform').value = item.platform;
        document.getElementById('formName').value = item.name;
        document.getElementById('formFollowers').value = item.followers;
        document.getElementById('formDesc').value = item.desc || '';
        document.getElementById('formUrl').value = item.url;
        document.getElementById('modalFormTitle').innerHTML = '<i class="fa-solid fa-pen-to-square text-red-500"></i><span>Chỉnh sửa</span>';
        document.getElementById('channelFormModal').classList.remove('hidden');
    }

    function closeChannelModal() { document.getElementById('channelFormModal').classList.add('hidden'); }

    function saveChannel(e) {
        e.preventDefault();
        if (!isAdmin) return;

        const editId = document.getElementById('editChannelId').value;
        const platform = document.getElementById('formPlatform').value;
        const name = document.getElementById('formName').value.trim();
        const followers = document.getElementById('formFollowers').value.trim();
        const desc = document.getElementById('formDesc').value.trim();
        const url = document.getElementById('formUrl').value.trim();

        if (!isValidUrl(url)) return showToast('❌ URL không hợp lệ (chỉ http/https)');
        if (!name || !followers) return showToast('❌ Thiếu thông tin');

        if (editId) {
            const idx = channels.findIndex(c => c.id === editId);
            if (idx !== -1) { channels[idx] = { id: editId, platform, name, followers, desc, url }; showToast('✅ Đã cập nhật'); }
        } else {
            channels.push({ id: Date.now().toString(), platform, name, followers, desc, url });
            showToast('✅ Đã thêm kênh');
        }
        saveToLocalStorage(); // Tự động đẩy lên mây
        closeChannelModal(); 
        renderCurrentTab();
    }

    function deleteChannel(id) {
        if (!isAdmin) return;
        const item = channels.find(c => c.id === id);
        if (item && confirm(`Xóa kênh "${item.name}"?`)) {
            channels = channels.filter(c => c.id !== id);
            saveToLocalStorage(); // Tự động đẩy lên mây
            renderCurrentTab(); 
            showToast('🗑️ Đã xóa');
        }
    }

    function resetChannels() {
        if (!isAdmin) return;
        if (confirm('Khôi phục danh sách mặc định?')) {
            channels = [...defaultChannels];
            saveToLocalStorage(); // Tự động đẩy lên mây
            renderCurrentTab(); 
            showToast('♻️ Đã khôi phục');
        }
    }

    // CONTACT & CLIPBOARD
    function sendContact() {
        const name = document.getElementById('contactName').value.trim();
        const msg = document.getElementById('contactMsg').value.trim();
        if (!name || !msg) return showToast('❌ Vui lòng nhập đủ thông tin');
        
        const subject = encodeURIComponent(`[VibNest Contact] ${name}`);
        const body = encodeURIComponent(`Họ tên: ${name}\n\nNội dung:\n${msg}`);
        window.location.href = `mailto:contact@vibnest.example?subject=${subject}&body=${body}`;
        showToast('📧 Đang mở ứng dụng email...');
        document.getElementById('contactName').value = ''; document.getElementById('contactMsg').value = '';
    }

    async function copyWeChatName() {
        const text = '👻正👻';
        try {
            if (navigator.clipboard?.writeText) await navigator.clipboard.writeText(text);
            else {
                const ta = document.createElement('textarea');
                ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
                document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
            }
            showToast('✅ Đã sao chép: ' + text);
        } catch { showToast('❌ Không thể sao chép'); }
    }

    // KHỞI TẠO
    document.addEventListener('DOMContentLoaded', async () => {
        // 1. Hiển thị giao diện trống trước để người dùng thấy web load nhanh
        renderCurrentTab();
        setupSecretTrigger();

        // 2. Tải dữ liệu từ máy chủ (nếu có mạng)
        channels = await loadChannels();
        
        // 3. Vẽ lại danh sách với dữ liệu vừa tải
        renderCurrentTab();

        // Enter trong ô nhập PIN
        document.getElementById('adminPinInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') verifyAdminPin();
        });
    });
    </script>
